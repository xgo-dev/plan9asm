name: Go CI

on:
  # Pull requests run this fast, complete single-SDK gate (<20 min wall clock).
  # The full 8-SDK, race, coverage, and Windows exhaustive matrix runs in
  # go-ci-full.yml on main pushes, weekly schedule, and manual dispatch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci_policy:
    name: CI policy preflight
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.1'

      - name: Setup verified policy runtime
        uses: ./.github/actions/setup-node22
        timeout-minutes: 10

      - name: Workflow scheduling regression tests
        run: node --test .github/scripts/priority-*.test.cjs

      - name: CI policy tests
        run: go test . -run '^(TestCI|TestFixedLocal|TestGoAMD64FixedLocal(Packed|Conversion)RuntimeOwnership$|TestX86PackedConversion(RequiredNativeOwners|CompleteNativeRuntimeOwnership)$|TestX86FloatingCompareRequiredLinuxBuildSelection$|TestRuntimeOracleCommand(ConsumersRetainOwnedExecution|AuditDistinguishesTestingRun)$)' -count=1

      - name: Compile explicit native AVX512 owners and verify their inventory
        run: go test . -tags=plan9asm_native_avx512 -run '^TestCIAVX512NativeQualificationInventory$' -count=1

      - name: Official corpus form baselines
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-go-asm-coverage.sh
          scripts/check-arm64-plan9-corpus.sh

  fmt:
    needs: ci_policy
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Go fmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  build:
    needs: ci_policy
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Go build
        run: go build ./...

      - name: Go build (cmd/plan9asm)
        run: go build ./...
        working-directory: cmd/plan9asm

      - name: Go build (cmd/plan9asmll)
        run: go build ./...
        working-directory: cmd/plan9asmll

  arm-scan:
    needs: ci_policy
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: ARM scan gate (all target OSes)
        run: |
          set -euo pipefail
          for target_goos in android freebsd linux netbsd openbsd plan9; do
            go run ./cmd/plan9asmscan -goos="$target_goos" -goarch=arm -repo-root . -format json -out "scan-$target_goos.json"
            python3 - "$PWD/scan-$target_goos.json" "$target_goos/arm" <<'PY'
          import json
          import sys

          path, target = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          unsupported = data.get("unsupported", [])
          parse_errs = data.get("parse_errs") or []
          print(f"scan {target}: packages={data['std_pkgs_with_sfile']} files={data['asm_files']} unsupported={len(unsupported)} parse_errs={len(parse_errs)}")
          if unsupported:
              top = ", ".join(f"{item['op']}({item['count']})" for item in unsupported[:12])
              raise SystemExit(f"{target}: unsupported ops remain: {top}")
          if parse_errs:
              top = ", ".join(f"{item['File']}: {item['Err']}" for item in parse_errs[:8])
              raise SystemExit(f"{target}: parse errors remain: {top}")
          PY
          done

  stdlib-corpus:
    needs: ci_policy
    name: stdlib instruction corpus (ubuntu-latest, Go ${{ matrix.go-version }})
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {go-version: '1.27.2', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {go-version: '1.20.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm'}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22 (Ubuntu)
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup Go for corpus tool build
        if: matrix.prebuild_tool
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Build corpus tool for older Go lane
        if: matrix.prebuild_tool
        shell: bash
        run: |
          tool="$RUNNER_TEMP/plan9asm"
          go build -C cmd/plan9asm -o "$tool" .
          echo "PLAN9ASM_CMD=$tool" >> "$GITHUB_ENV"

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}

      - name: Stdlib asm corpus gate
        shell: bash
        env:
          PLAN9ASM_CORPUS_TARGETS: ${{ matrix.targets }}
        run: |
          chmod +x scripts/check-stdlib-corpus.sh
          scripts/check-stdlib-corpus.sh --instructions-only

      - name: Official Go assembler coverage regression
        shell: bash
        run: |
          chmod +x scripts/check-go-asm-coverage.sh
          scripts/check-go-asm-coverage.sh

  test:
    needs: ci_policy
    name: test (ubuntu-latest, 1.27.2, ${{ matrix.module-role }})
    timeout-minutes: 40
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        module-role: [root-0, root-1, root-2, root-3, root-4, root-5, root-6, root-7,
          root-8, root-9, root-10, root-11, root-12, root-13, root-14, root-15, profile, other]
        include:
          - {module-role: root-0, module-owner: 0, root-partition: 0}
          - {module-role: root-1, module-owner: 0, root-partition: 1}
          - {module-role: root-2, module-owner: 0, root-partition: 2}
          - {module-role: root-3, module-owner: 0, root-partition: 3}
          - {module-role: root-4, module-owner: 0, root-partition: 4}
          - {module-role: root-5, module-owner: 0, root-partition: 5}
          - {module-role: root-6, module-owner: 0, root-partition: 6}
          - {module-role: root-7, module-owner: 0, root-partition: 7}
          - {module-role: root-8, module-owner: 0, root-partition: 8}
          - {module-role: root-9, module-owner: 0, root-partition: 9}
          - {module-role: root-10, module-owner: 0, root-partition: 10}
          - {module-role: root-11, module-owner: 0, root-partition: 11}
          - {module-role: root-12, module-owner: 0, root-partition: 12}
          - {module-role: root-13, module-owner: 0, root-partition: 13}
          - {module-role: root-14, module-owner: 0, root-partition: 14}
          - {module-role: root-15, module-owner: 0, root-partition: 15}
          - {module-role: profile, module-owner: 1, root-partition: -1}
          - {module-role: other, module-owner: 2, root-partition: -1}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Install LLVM 22 (Ubuntu)
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh gcc-i686-linux-gnu libc6-dev-i386-cross gcc-aarch64-linux-gnu

      - name: Install required 386 execution runtime
        timeout-minutes: 5
        run: bash scripts/install-ci-qemu.sh

      - name: Setup required wasm execution runtime
        uses: ./.github/actions/setup-node22
        timeout-minutes: 10

      - name: Go test (Ubuntu PR gate)
        run: bash scripts/test-module-ci.sh pr-test execute ${{ matrix.module-owner }} ${{ matrix.root-partition }}

      - name: Required exact downloaded AMD64 numerical fixture
        if: matrix.module-owner == 2
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64
          scope='^TestAMD64DownloadedFixedLocalLLVM22Numerical$'
          go test ./gotoolprofile -list="$scope" | grep -Fx 'TestAMD64DownloadedFixedLocalLLVM22Numerical'
          go test ./gotoolprofile -run="$scope" -count=1 -timeout=10m

  test-min-go:
    needs: ci_policy
    name: min-SDK compatibility (ubuntu-latest, 1.20.x)
    timeout-minutes: 20
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.20.x'

      - name: Build all packages and test internal/tooling on Go 1.20
        run: |
          set -euo pipefail
          go build ./...
          go test -count=1 -timeout=10m ./internal/... ./cmd/plan9asmscan/...

  race-core:
    needs: ci_policy
    name: race (core & internal packages, 1.27.2)
    timeout-minutes: 25
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup required wasm execution runtime
        uses: ./.github/actions/setup-node22
        timeout-minutes: 10

      - name: Go test -race (fast internal packages & typed effects)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./internal/... | grep -Ev '/internal/(sdkfrontend|gostaticstorage)$')
          go test -race -count=1 -timeout=15m "${pkgs[@]}"
          go test -race -count=1 -timeout=15m -run '^(TestX86ResultTypedVectorEffect|TestX86ADJSPStaticAddressComposition|TestX86OwnedStaticLEADelta|TestX86StaticIntegerSBAddresses|TestX86NativeLEAWRetainedPointer|TestX86OwnedPackedArithmeticRetainsAuthorityBoundaries)$' .

  nested-cli:
    needs: ci_policy
    name: cli test (ubuntu-latest, 1.27.2, ${{ matrix.module }})
    timeout-minutes: 30
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        module: [plan9asm, plan9asmll]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Install LLVM 22 and cross compilers
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh gcc-i686-linux-gnu libc6-dev-i386-cross gcc-aarch64-linux-gnu

      - name: Install required execution runtimes
        timeout-minutes: 5
        run: bash scripts/install-ci-qemu.sh

      - name: Setup required wasm execution runtime
        timeout-minutes: 10
        uses: ./.github/actions/setup-node22

      - name: Run complete CLI suite
        working-directory: cmd/${{ matrix.module }}
        run: go test -count=1 -timeout=25m ./...

  cross-runtime:
    needs: ci_policy
    name: cross compile, link, and run (Linux, shard ${{ matrix.owner }}/8)
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        owner: [0, 1, 2, 3, 4, 5, 6, 7]

    env:
      GOFLAGS: ''
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      PLAN9ASM_CROSS_EXEC: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM and cross compilers
        timeout-minutes: 14
        run: >-
          bash scripts/install-ci-llvm22-ubuntu.sh
          gcc-i686-linux-gnu gcc-arm-linux-gnueabihf
          gcc-aarch64-linux-gnu

      - name: Install pinned QEMU user-mode emulators
        timeout-minutes: 5
        run: bash scripts/install-ci-qemu.sh

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Setup required wasm execution runtime
        timeout-minutes: 10
        uses: ./.github/actions/setup-node22

      - name: Cross transpile, compile, link, and run
        run: |
          mkdir -p _out
          go run ./cmd/plan9asmtest -out _out/cross-runtime-owner \
            -ci-selector '^(TestCrossLinuxRuntimeMatrix|TestARM64Conformance|TestARM64RawSQSHLURuntimeSemantics|TestARMIntegerMemoryRuntimeCross|TestARMRawSaturationRuntimeCross)' \
            -ci-isolate-root TestCrossLinuxRuntimeMatrix \
            -ci-owner ${{ matrix.owner }} -shards 8 -timeout 25m
