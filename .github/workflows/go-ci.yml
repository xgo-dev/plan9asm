    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        timeout-minutes: 10
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.2'

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh gcc-i686-linux-gnu libc6-dev-i386-cross gcc-aarch64-linux-gnu

      - name: Install required 386 execution runtime
        timeout-minutes: 5
        run: bash scripts/install-ci-qemu.sh

      - name: Setup required wasm execution runtime
        uses: ./.github/actions/setup-node22
        timeout-minutes: 10

      - name: Go test with coverage
        run: bash scripts/test-module-ci.sh coverage execute ${{ matrix.module-owner }} ${{ matrix.root-partition }}

      - name: Retain complete module coverage owner evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: module-coverage-1.27.2-${{ matrix.module-role }}
          path: _out/module-coverage/
          if-no-files-found: error

  # Coverage-instrumented CLI suites retain their own complete command budget,
  # independent of the main module and of the ordinary nested CLI matrix.
  nested-cli-coverage:
    needs: ci_policy
    name: coverage (ubuntu-latest, 1.27.2, ${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: [plan9asm, plan9asmll]

    uses: ./.github/workflows/linux-cli-module.yml
    with:
      module: ${{ matrix.module }}
      go-version: '1.27.2'
      flavor: coverage

  module-completion:
    needs: [test, nested-cli, race, coverage, nested-cli-coverage]
    if: ${{ !cancelled() }}
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
