name: Go CI

on:
  # Pull requests own validation for contribution branches. Restrict push
  # validation to the default branch so one commit does not run both events.
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Keep one run per event and source branch. A newer PR synchronization
  # cancels the superseded run while main push validation always completes.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Go fmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 19
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19 libclang-19-dev lld-19 libunwind-19-dev libc++-19-dev
          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Go build
        run: go build ./...

      - name: Go build (cmd/plan9asm)
        run: go build ./...
        working-directory: cmd/plan9asm

      - name: Go build (cmd/plan9asmll)
        run: go build ./...
        working-directory: cmd/plan9asmll

  stdlib-corpus:
    name: stdlib-corpus (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the authoritative cross-target corpus gate.
          - {os: ubuntu-latest, go-version: '1.20.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm'}
          - {os: ubuntu-latest, go-version: '1.21.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, go-version: '1.22.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, go-version: '1.23.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, go-version: '1.24.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, go-version: '1.25.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, go-version: '1.26.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, go-version: '1.27.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          # Native hosts are auxiliary integration checks on the latest Go.
          - {os: macos-latest, go-version: '1.27.x', targets: 'darwin/amd64,darwin/arm64'}
          - {os: windows-latest, go-version: '1.27.x', targets: 'windows/386,windows/amd64,windows/arm64'}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 19 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19 libclang-19-dev lld-19 libunwind-19-dev libc++-19-dev
          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install LLVM 19 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@19
          echo "PATH=$(brew --prefix llvm@19)/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install LLVM 19 (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-llvm19

      - name: Setup Go for corpus tool build
        if: matrix.prebuild_tool
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build corpus tool for older Go lane
        if: matrix.prebuild_tool
        shell: bash
        run: |
          tool="$RUNNER_TEMP/plan9asm"
          go build -C cmd/plan9asm -o "$tool" .
          echo "PLAN9ASM_CMD=$tool" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Stdlib asm corpus gate
        shell: bash
        env:
          PLAN9ASM_CORPUS_TARGETS: ${{ matrix.targets }}
        run: |
          chmod +x scripts/check-stdlib-corpus.sh
          scripts/check-stdlib-corpus.sh

      - name: Official Go assembler coverage regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/check-go-asm-coverage.sh
          scripts/check-go-asm-coverage.sh

  cross-runtime:
    name: cross compile, link, and run (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM, cross compilers, and QEMU
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            llvm-19-dev clang-19 lld-19 \
            gcc-i686-linux-gnu gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu \
            qemu-user
          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Cross transpile, compile, link, and run
        env:
          PLAN9ASM_CROSS_EXEC: '1'
        run: go test . -run '^TestCrossLinuxRuntimeMatrix$' -count=1 -v

  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep both matrix variants visible even if one fails.
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, go-version: '1.20.x', nested_modules: false}
          - {os: ubuntu-latest, go-version: '1.21.x', nested_modules: false}
          - {os: ubuntu-latest, go-version: '1.22.x', nested_modules: false}
          - {os: ubuntu-latest, go-version: '1.23.x', nested_modules: false}
          - {os: ubuntu-latest, go-version: '1.24.x', nested_modules: true}
          - {os: ubuntu-latest, go-version: '1.25.x', nested_modules: true}
          - {os: ubuntu-latest, go-version: '1.26.x', nested_modules: true}
          - {os: ubuntu-latest, go-version: '1.27.x', nested_modules: true}
          - {os: windows-latest, go-version: '1.27.x', nested_modules: true}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install LLVM 19 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19 libclang-19-dev lld-19 libunwind-19-dev libc++-19-dev
          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install LLVM 19 (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-llvm19

      - name: LLVM tools info
        shell: bash
        run: |
          command -v llc
          llc --version
          command -v clang
          clang --version

      - name: Go test (Ubuntu)
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Go test (cmd/plan9asm, Ubuntu)
        if: runner.os != 'Windows' && matrix.nested_modules
        run: go test ./...
        working-directory: cmd/plan9asm

      - name: Go test (cmd/plan9asmll, Ubuntu)
        if: runner.os != 'Windows' && matrix.nested_modules
        run: go test ./...
        working-directory: cmd/plan9asmll

      - name: Go test with coverage (Windows)
        if: runner.os == 'Windows' && matrix.go-version == '1.27.x'
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage-windows-root.out
          (cd cmd/plan9asm && go test ./... -coverprofile=../../coverage-windows-plan9asm.out)
          (cd cmd/plan9asmll && go test ./... -coverprofile=../../coverage-windows-plan9asmll.out)

      - name: Go test (Windows)
        if: runner.os == 'Windows' && matrix.go-version != '1.27.x'
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          (cd cmd/plan9asm && go test ./...)
          (cd cmd/plan9asmll && go test ./...)

      - name: Upload Windows coverage to Codecov
        if: runner.os == 'Windows' && matrix.go-version == '1.27.x'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage-windows-root.out,./coverage-windows-plan9asm.out,./coverage-windows-plan9asmll.out
          disable_search: true
          flags: windows
          name: windows-go1.27
          fail_ci_if_error: true
          verbose: true

  arm-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - android
          - freebsd
          - linux
          - netbsd
          - openbsd
          - plan9

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 19
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y llvm-19-dev clang-19 libclang-19-dev lld-19 libunwind-19-dev libc++-19-dev && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: ARM scan gate
        env:
          TARGET_GOOS: ${{ matrix.goos }}
        run: |
          go run ./cmd/plan9asmscan -goos="$TARGET_GOOS" -goarch=arm -repo-root . -format json -out scan.json
          python3 - "$PWD/scan.json" "$TARGET_GOOS/arm" <<'PY'
          import json
          import sys

          path, target = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          unsupported = data.get("unsupported", [])
          parse_errs = data.get("parse_errs") or []
          print(f"scan {target}: packages={data['std_pkgs_with_sfile']} files={data['asm_files']} unsupported={len(unsupported)} parse_errs={len(parse_errs)}")
          if unsupported:
              top = ", ".join(f"{item['op']}({item['count']})" for item in unsupported[:12])
              raise SystemExit(f"{target}: unsupported ops remain: {top}")
          if parse_errs:
              top = ", ".join(f"{item['File']}: {item['Err']}" for item in parse_errs[:8])
              raise SystemExit(f"{target}: parse errors remain: {top}")
          PY

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install LLVM 19
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19 libclang-19-dev lld-19 libunwind-19-dev libc++-19-dev
          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> "$GITHUB_ENV"

      - name: Go test (race)
        run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install LLVM 19
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev clang-19 libclang-19-dev lld-19 libunwind-19-dev libc++-19-dev
          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> "$GITHUB_ENV"

      - name: Go test with coverage
        run: |
          go test ./... -coverprofile=coverage-root.out
          go tool cover -func=coverage-root.out | tail -n 1

      - name: Go test with coverage (cmd/plan9asm)
        run: |
          go test ./... -coverprofile=coverage-plan9asm.out
          go tool cover -func=coverage-plan9asm.out | tail -n 1
        working-directory: cmd/plan9asm

      - name: Go test with coverage (cmd/plan9asmll)
        run: |
          go test ./... -coverprofile=coverage-plan9asmll.out
          go tool cover -func=coverage-plan9asmll.out | tail -n 1
        working-directory: cmd/plan9asmll

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage-root.out
          disable_search: true
          flags: unittests
          name: ubuntu-go1.27
          fail_ci_if_error: false
          verbose: true
