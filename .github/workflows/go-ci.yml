name: Go CI

on:
  # Pull requests own validation for contribution branches. Restrict push
  # validation to the default branch so one commit does not run both events.
  push:
    branches:
      - main
  pull_request:

concurrency:
  # Keep one run per event and source branch. A newer PR synchronization
  # cancels the superseded run while main push validation always completes.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: Go fmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  build:
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: Go build
        run: go build ./...

      - name: Go vet (native & 32-bit host)
        run: |
          go vet ./...
          GOOS=linux GOARCH=386 go vet ./gotoolprofile ./internal/preprocess ./internal/asm ./internal/x86 ./internal/arm64 ./internal/arm ./internal/wasm

      - name: Go build (cmd/plan9asm)
        run: go build ./...
        working-directory: cmd/plan9asm

      - name: Go build (cmd/plan9asmll)
        run: go build ./...
        working-directory: cmd/plan9asmll

      - name: ARM64 Plan 9 reference corpus
        run: scripts/check-arm64-plan9-corpus.sh

  reported_library_list:
    name: Third-party corpus matrix
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}
    outputs:
      libraries: ${{ steps.matrix.outputs.libraries }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read third-party library manifest
        id: matrix
        run: |
          manifest=testdata/corpus/reported-libraries.json
          if ! jq -e '.libraries | length > 0 and all(.[]; (.id | test("^[a-z0-9]+(-[a-z0-9]+)*$")))' "$manifest" >/dev/null; then
            echo "third-party library ids must match ^[a-z0-9]+(-[a-z0-9]+)*$" >&2
            exit 1
          fi
          libraries=$(jq -c '[.libraries[].id]' "$manifest")
          printf '%s\n' "libraries=$libraries" >> "$GITHUB_OUTPUT"

  reported_library_corpus:
    name: third-party-corpus (${{ matrix.library }})
    needs: reported_library_list
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJSON(needs.reported_library_list.outputs.libraries) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: Scan latest module and compile complete asm corpus
        env:
          REPORTED_LIBRARY: ${{ matrix.library }}
        run: scripts/check-reported-library-corpus.sh "$REPORTED_LIBRARY"

  stdlib-corpus:
    name: stdlib-corpus (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ github.repository_owner == 'xgo-dev' && matrix.runner || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the authoritative cross-target corpus gate. Each
          # unversioned Linux architecture and wasm target expands to every
          # setting supported by that Go toolchain in check-stdlib-corpus.sh.
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.20.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm'}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.21.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.22.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.23.x', prebuild_tool: true, targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.24.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.25.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.26.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.27.x', targets: 'linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64,windows/386,windows/amd64,windows/arm64,js/wasm,wasip1/wasm'}
          # Native hosts are auxiliary integration checks on the latest Go.
          - {os: macos-latest, go-version: '1.27.x', targets: 'darwin/amd64,darwin/arm64'}
          - {os: windows-latest, go-version: '1.27.x', targets: 'windows/386,windows/amd64,windows/arm64'}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "PATH=$(brew --prefix llvm@22)/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install LLVM 22 (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-llvm22

      - name: Setup Go for corpus tool build
        if: matrix.prebuild_tool
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build corpus tool for older Go lane
        if: matrix.prebuild_tool
        shell: bash
        run: |
          tool="$RUNNER_TEMP/plan9asm"
          go build -C cmd/plan9asm -o "$tool" .
          echo "PLAN9ASM_CMD=$tool" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Stdlib asm corpus gate
        shell: bash
        env:
          PLAN9ASM_CORPUS_TARGETS: ${{ matrix.targets }}
        run: |
          chmod +x scripts/check-stdlib-corpus.sh
          scripts/check-stdlib-corpus.sh

      - name: Official Go assembler coverage regression
        shell: bash
        run: |
          chmod +x scripts/check-go-asm-coverage.sh
          scripts/check-go-asm-coverage.sh

  cross-runtime:
    name: cross compile, link, and run (Linux)
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM, cross compilers, and QEMU
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            llvm-22-dev clang-22 lld-22 \
            gcc-i686-linux-gnu gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu \
            qemu-user
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: Cross transpile, compile, link, and run
        env:
          PLAN9ASM_CROSS_EXEC: '1'
        run: go test . -run '^(TestCrossLinuxRuntimeMatrix|TestARM64Conformance)' -count=1 -v

  amd64-diff-gate:
    name: amd64-diff-gate (Linux, LLVM 22)
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: Mandatory amd64 machine-code differential gate
        env:
          PLAN9ASM_REQUIRE_AMD64_DIFF: '1'
          PLAN9ASM_DIFF_REPORT_OUT: ${{ runner.temp }}/amd64-diff-report.json
        run: |
          rm -f "$PLAN9ASM_DIFF_REPORT_OUT"
          go test -v -count=1 -run '^(TestAMD64ConformanceNativeGo|TestAMD64ConformanceLLVMRuntime|TestAMD64MachineCodeDifferentialGate|TestTranslateGoModuleAMD64PopAndPushfqInitPropagation|TestTranslateGoModuleAMD64PrivateSPConfinement|TestTranslateGoModuleAMD64UndefinedFlagPropagationMatrix|TestTranslateGoModuleAMD64X87StatusAndStackPrecision|TestTranslateGoModuleAMD64VecLaneSelectPrecision|TestTranslateGoModuleAMD64PerBitEntryFlagDifferential|TestTranslateGoModuleAMD64X87StackAndConstants|TestStep1ExplicitUnsupportedAuditRegistry)$' .
          go test -v -count=1 ./testdata/conformance/amd64
          go run ./cmd/plan9asmscan \
            -corpus=go-asm \
            -goroot="$(go env GOROOT)" \
            -goos=linux \
            -goarch=amd64 \
            -repo-root=. \
            -verify-obj \
            -diff-report="$PLAN9ASM_DIFF_REPORT_OUT" \
            -format=json \
            -out="$RUNNER_TEMP/amd64-coverage.json"
          python3 - "$RUNNER_TEMP/amd64-coverage.json" "$PLAN9ASM_DIFF_REPORT_OUT" <<'PY'
          import json, sys
          cov = json.load(open(sys.argv[1], encoding="utf-8"))
          diff = json.load(open(sys.argv[2], encoding="utf-8"))
          assert cov.get("object_compiled_verified") is True, "object_compiled_verified must be true"
          llvm_ver = cov.get("object_compile_llvm_version", "")
          assert llvm_ver.startswith("22."), f"expected LLVM 22 object verification, got {llvm_ver!r}"
          assert cov.get("object_compile_failed_forms", 0) == 0, f"object compile failures: {cov.get('object_compile_failed_forms')}"
          assert cov["object_compiled_forms"] == cov["ir_generated_forms"], (
              f"object_compiled ({cov['object_compiled_forms']}) != ir_generated ({cov['ir_generated_forms']})"
          )
          assert cov.get("diff_report_loaded") is True, "diff_report_loaded must be true"
          assert cov.get("diff_report_native_oracle") is True, "diff_report_native_oracle must be true"
          assert cov.get("diff_failed_forms", 0) == 0, f"diff_failed_forms={cov.get('diff_failed_forms')}"
          assert cov.get("diff_expected_only_forms", 0) == 0, f"diff_expected_only_forms={cov.get('diff_expected_only_forms')}"
          for c in diff.get("cases", []):
              if c.get("status") == "passed":
                  assert c.get("verification_mode") == "native_diff", f"passed case {c.get('id')} missing native_diff mode: {c}"
                  assert c.get("compared_inputs", 0) > 0, f"passed case {c.get('id')} has zero compared_inputs"
          verified = cov["diff_verified_forms"]
          pending = cov.get("hw_pending_forms", 0)
          manifest = cov["manifest_execute_forms"]
          compared_inputs = cov.get("diff_report_compared_inputs", 0)
          assert verified > 0 and verified + pending == manifest, (
              f"execution-traceable diff count mismatch: verified={verified} + hw_pending={pending} != manifest_execute={manifest}"
          )
          assert compared_inputs >= 2260, f"expected >= 2260 per-input native diff comparisons, got {compared_inputs}"
          print(
              f"amd64-diff-gate coverage verified: llvm={llvm_ver} ir_generated={cov['ir_generated_forms']} "
              f"object_compiled={cov['object_compiled_forms']} diff_verified={verified} hw_pending={pending} "
              f"expected_only={cov.get('diff_expected_only_forms', 0)} manifest_execute={manifest} "
              f"compared_inputs={compared_inputs} cases={len(diff.get('cases', []))} unsupported={cov['unsupported_forms']}"
          )
          PY

  test:
    name: test (${{ matrix.os }}, ${{ matrix.go-version }}, ${{ matrix.nested_modules }})
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ github.repository_owner == 'xgo-dev' && matrix.runner || matrix.os }}
    strategy:
      # Keep both matrix variants visible even if one fails.
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.20.x', nested_modules: false}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.21.x', nested_modules: false}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.22.x', nested_modules: false}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.23.x', nested_modules: false}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.24.x', nested_modules: true}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.25.x', nested_modules: true}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.26.x', nested_modules: true}
          - {os: ubuntu-latest, runner: [qiniu, ubuntu-24.04-large], go-version: '1.27.x', nested_modules: true}
          - {os: windows-latest, go-version: '1.27.x', nested_modules: true}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install LLVM 22 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install LLVM 22 (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-llvm22

      - name: LLVM tools info
        shell: bash
        run: |
          command -v llc
          llc --version
          command -v clang
          clang --version

      - name: Go test (Ubuntu)
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Go test (cmd/plan9asm, Ubuntu)
        if: runner.os != 'Windows' && matrix.nested_modules
        run: go test ./...
        working-directory: cmd/plan9asm

      - name: Go test (cmd/plan9asmll, Ubuntu)
        if: runner.os != 'Windows' && matrix.nested_modules
        run: go test ./...
        working-directory: cmd/plan9asmll

      - name: Go test with coverage (Windows)
        if: runner.os == 'Windows' && matrix.go-version == '1.27.x'
        shell: bash
        run: |
          set -euo pipefail
          go test -coverpkg=./... ./... -coverprofile=coverage-windows-root.out
          (cd cmd/plan9asm && go test ./... -coverprofile=../../coverage-windows-plan9asm.out)
          (cd cmd/plan9asmll && go test ./... -coverprofile=../../coverage-windows-plan9asmll.out)

      - name: Go test (Windows)
        if: runner.os == 'Windows' && matrix.go-version != '1.27.x'
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          (cd cmd/plan9asm && go test ./...)
          (cd cmd/plan9asmll && go test ./...)

      - name: Upload Windows coverage to Codecov
        if: runner.os == 'Windows' && matrix.go-version == '1.27.x'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage-windows-root.out,./coverage-windows-plan9asm.out,./coverage-windows-plan9asmll.out
          disable_search: true
          flags: windows
          name: windows-go1.27
          fail_ci_if_error: true
          verbose: true

  arm-scan:
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        goos:
          - android
          - freebsd
          - linux
          - netbsd
          - openbsd
          - plan9

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: ARM scan gate
        env:
          TARGET_GOOS: ${{ matrix.goos }}
        run: |
          go run ./cmd/plan9asmscan -goos="$TARGET_GOOS" -goarch=arm -repo-root . -format json -out scan.json
          python3 - "$PWD/scan.json" "$TARGET_GOOS/arm" <<'PY'
          import json
          import sys

          path, target = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          unsupported = data.get("unsupported", [])
          parse_errs = data.get("parse_errs") or []
          print(f"scan {target}: packages={data['std_pkgs_with_sfile']} files={data['asm_files']} unsupported={len(unsupported)} parse_errs={len(parse_errs)}")
          if unsupported:
              top = ", ".join(f"{item['op']}({item['count']})" for item in unsupported[:12])
              raise SystemExit(f"{target}: unsupported ops remain: {top}")
          if parse_errs:
              top = ", ".join(f"{item['File']}: {item['Err']}" for item in parse_errs[:8])
              raise SystemExit(f"{target}: parse errors remain: {top}")
          PY

  race:
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install LLVM 22
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Go test (race)
        run: go test -race ./...

  coverage:
    runs-on: ${{ github.repository_owner == 'xgo-dev' && fromJSON('["qiniu", "ubuntu-24.04-large"]') || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install LLVM 22
        run: |
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc >/dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-22-dev lld-22 libunwind-22-dev libc++-22-dev
          echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> "$GITHUB_ENV"

      - name: Go test with coverage
        run: |
          go test -coverpkg=./... ./... -coverprofile=coverage-root.out
          go tool cover -func=coverage-root.out | tail -n 1

      - name: Go test with coverage (cmd/plan9asm)
        run: |
          go test ./... -coverprofile=coverage-plan9asm.out
          go tool cover -func=coverage-plan9asm.out | tail -n 1
        working-directory: cmd/plan9asm

      - name: Go test with coverage (cmd/plan9asmll)
        run: |
          go test ./... -coverprofile=coverage-plan9asmll.out
          go tool cover -func=coverage-plan9asmll.out | tail -n 1
        working-directory: cmd/plan9asmll

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage-root.out
          disable_search: true
          flags: unittests
          name: ubuntu-go1.27
          fail_ci_if_error: false
          verbose: true
