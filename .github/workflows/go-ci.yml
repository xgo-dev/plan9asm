          - {flavor: test, go-version: '1.24.x'}
          - {flavor: test, go-version: '1.25.x'}
          - {flavor: test, go-version: '1.26.x'}
          - {flavor: test, go-version: '1.27.2'}
          - {flavor: race, go-version: '1.27.2'}
          - {flavor: coverage, go-version: '1.27.2'}
