name: Setup Node.js 22
description: Install the exact Node.js runtime shared by CI producers and verifiers

runs:
  using: composite
  steps:
    - name: Install Node.js 22
      id: install_node22
      uses: actions/setup-node@v6
      with:
        node-version: '22.23.4'

    # An installer step marked successful without its output must not borrow
    # the runner image's ambient Node or produce an incompatible WASM scope.
    - name: Verify Node.js installation
      shell: bash
      env:
        EXPECTED_NODE_VERSION: 'v22.23.4'
        INSTALLED_NODE_VERSION: ${{ steps.install_node22.outputs.node-version }}
      run: |
        set -euo pipefail

        if [[ "$INSTALLED_NODE_VERSION" != "$EXPECTED_NODE_VERSION" ]]; then
          echo "Expected Node $EXPECTED_NODE_VERSION, installer reported '$INSTALLED_NODE_VERSION'" >&2
          exit 1
        fi

        actual="$(node --version)"
        actual="${actual%$'\r'}"
        if [[ "$actual" != "$EXPECTED_NODE_VERSION" ]]; then
          echo "Installed Node $INSTALLED_NODE_VERSION, but PATH selects '$actual'" >&2
          exit 1
        fi
        printf 'Verified Node %s: %s\n' "$actual" "$(command -v node)"
